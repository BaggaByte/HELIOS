name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend: lint + type-check + tests ───────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (including dev tools)
        run: uv sync --group dev

      - name: Create .env for CI
        run: |
          # .env.example lives at the repo root, one level above services/
          cp ../.env.example .env
          # Override required fields for CI environment
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> .env
          echo "DEBUG=True" >> .env
          echo "DATABASE_URL=sqlite+aiosqlite:///./test_helios.db" >> .env
          echo "CORS_ORIGINS=[\"http://localhost:3000\"]" >> .env

      - name: Lint with Ruff
        run: uv run ruff check helios/
        continue-on-error: true

      - name: Format check with Ruff
        run: uv run ruff format --check helios/
        continue-on-error: true

      - name: Type check with mypy
        run: uv run mypy helios/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # mypy warnings don't block CI yet

      - name: Run tests
        env:
          PYTHONPATH: .
        run: uv run pytest tests/ -v --tb=short

  # ── Frontend: type-check + build ─────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # Use the root package-lock.json for caching since the monorepo
          # lockfile lives at the repo root, not inside apps/web.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Run from repo root so npm workspaces resolves correctly.
        working-directory: .
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run frontend tests
        run: npm run test --if-present

      - name: Build
        run: npm run build

  # ── Desktop: Rust fmt + clippy ────────────────────────────────
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Format check
        run: cargo fmt -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true
